services:
 
  next:
    restart: always
    container_name: prod.urbankiff.com
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3500:3000'
    env_file:
      - .env
    networks:
      - prod_urbankiff
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
 
networks:
  prod_urbankiff:
    name: prod_urbankiff
    driver: bridge
    external: true
 