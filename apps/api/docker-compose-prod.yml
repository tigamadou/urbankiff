services:
  migrations:
    restart: always
    container_name: urbankiff-prod-api-migrations
    build: .
    env_file:
      - .env
    command: sh -c "python manage.py migrate &&
                    python manage.py loaddata fixtures/admin.json &&
                    python manage.py loaddata fixtures/mail.json &&
                    python manage.py prodseed"
    volumes:
      - .:/app
    networks:
      - prod_urbankiff

  api:
    restart: always
    container_name: urbankiff-prod-api
    build: .
    env_file:
      - .env
    domainname: api.urbankiff.com
    ports:
      - '8001:8000'
    environment:
      - NODE_ENV=development
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
    depends_on:
      - migrations
    volumes:
      - .:/app
    command:  ['python', 'manage.py', 'runserver', '0.0.0.0:8000']
    networks:
      - prod_urbankiff

  workers:
    restart: always
    container_name: urbankiff-prod-api-workers
    build: .
    command: ['python', 'manage.py', 'runworkers']
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
    volumes:
      - .:/urbankiff-api
    depends_on:
      - migrations
    networks:
      - prod_urbankiff
  redis:
    image: redis:alpine
    container_name: urbankiff-prod-redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    networks:
      - prod_urbankiff
networks:
  prod_urbankiff:
    name: prod_urbankiff
    driver: bridge
    external: true
