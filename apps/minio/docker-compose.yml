version: "3"
services:
    minio:
        container_name: ${MINIO_CONTAINER_NAME}
        image: docker.io/bitnami/minio:2022
        ports:
            - "9000:9000"
            - "9001:9001"
        networks:
            - preprod_urbankiff
        volumes:
            - "preprod_minio_data:/data"
        environment:
            - MINIO_ROOT_USER=${MINIO_ROOT_USER}
            - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
            - MINIO_DEFAULT_BUCKETS=${MINIO_DEFAULT_BUCKETS}


volumes:
    preprod_minio_data:
        driver: local

networks:
    preprod_urbankiff:
        name: preprod_urbankiff
        driver: bridge
        external: true
