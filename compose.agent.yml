# Environnement d'agent devteam : services applicatifs seulement, sur l'infrastructure partagée de la stack principale
# (projet Compose `urbankiff`, réseau externe URBANKIFF). Fichier autonome, lancé par scripts/devteam/agent-env/agent-env.sh
# avec `-p urbankiff-ag-<lot>` et les variables de .agent.env (AGENT_LOT, AGENT_DB_NAME, REDIS_DB_1, AGENT_S3_BUCKET, AGENT_PORT).
# Règles : pas de container_name, aucun port fixe, aucun service d'infrastructure ni depends_on vers eux.
# Services préfixés `agent-` : sur le réseau URBANKIFF, Compose donne à chaque service l'alias DNS de son nom ; un service nommé
# `api` ou `nextjs` capterait une partie du trafic de la stack principale (Caddy, nextjs principal -> api:8000).
# Port : seul agent-api publie 127.0.0.1:${AGENT_PORT}:8000 (un seul AGENT_PORT existe). agent-nextjs et agent-panel ne publient
# rien : pas d'e2e dans ce projet, les profils front et panel n'ont pas d'entrée hôte. Leurs .env pointent sur l'api principale.

services:
  agent-migrations:
    build: ${API_FOLDER}
    command: sh -c "python manage.py migrate && python manage.py loaddata fixtures/admin.json && python manage.py loaddata fixtures/mail.json && python manage.py prodseed"
    environment:
      - POSTGRES_DB=${AGENT_DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST=postgresDB
      - REDIS_ENDPOINT=redis://redis_cache:6379/${REDIS_DB_1}
      - MINIO_DEFAULT_BUCKETS=${AGENT_S3_BUCKET}
      - AGENT_LOT=${AGENT_LOT}
      - FILES_CDN_ENDPOINT=http://api.urbankiff.local/file
    volumes:
      - ${API_FOLDER}:/app
    networks:
      - URBANKIFF

  agent-api:
    build: ${API_FOLDER}
    env_file:
      - ${API_FOLDER}/.env
    environment:
      - POSTGRES_DB=${AGENT_DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST=postgresDB
      - REDIS_ENDPOINT=redis://redis_cache:6379/${REDIS_DB_1}
      - MINIO_DEFAULT_BUCKETS=${AGENT_S3_BUCKET}
      - AGENT_LOT=${AGENT_LOT}
    ports:
      - "127.0.0.1:${AGENT_PORT}:8000"
    depends_on:
      - agent-migrations
    volumes:
      - ${API_FOLDER}:/app
    networks:
      - URBANKIFF
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  agent-workers:
    build: ${API_FOLDER}
    command: ["python", "manage.py", "runworkers"]
    env_file:
      - ${API_FOLDER}/.env
    environment:
      - POSTGRES_DB=${AGENT_DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST=postgresDB
      - REDIS_ENDPOINT=redis://redis_cache:6379/${REDIS_DB_1}
      - MINIO_DEFAULT_BUCKETS=${AGENT_S3_BUCKET}
      - AGENT_LOT=${AGENT_LOT}
    volumes:
      - ${API_FOLDER}:/${API_CONTAINER_NAME}
    depends_on:
      - agent-migrations
    networks:
      - URBANKIFF

  agent-nextjs:
    build:
      context: ${FRONT_NEXTJS_FOLDER}
      dockerfile: Dockerfile.dev
    env_file:
      - ${FRONT_NEXTJS_FOLDER}/.env
    environment:
      - NODE_ENV=development
    volumes:
      - ${FRONT_NEXTJS_FOLDER}:/app
      - nextjs_node_modules:/app/node_modules
    networks:
      - URBANKIFF

  agent-panel:
    image: node:20-alpine
    environment:
      - NODE_ENV=development
      - REACT_APP_BACKEND_URL=${API_URL}
      - NODE_OPTIONS=--openssl-legacy-provider
    volumes:
      - ${PANEL_FOLDER}:/app
    networks:
      - URBANKIFF
    command: sh -c "cd app/ && cp .env.development .env && yarn && yarn start"

volumes:
  nextjs_node_modules:

networks:
  URBANKIFF:
    name: URBANKIFF
    external: true
