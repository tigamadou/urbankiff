name: Copie prod vers preprod

on:
  workflow_dispatch:

permissions: {}

jobs:
  exporter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod
    concurrency:
      group: deploiement-prod
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Calculer la date
        id: date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Préparer SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
      - name: Exporter la prod en version anonymisée
        env:
          DATE: ${{ steps.date.outputs.date }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "date invalide" >&2; exit 1; }
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "variable DEPLOY_HOST absente ou invalide" >&2; exit 1; }
          ssh -i "$RUNNER_TEMP/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" "deploy@$DEPLOY_HOST" exporter-anonyme "$DATE" < /dev/null
      - name: Nettoyage
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"

  restaurer:
    needs: exporter
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: preprod
    concurrency:
      group: deploiement-preprod
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Préparer SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
      - name: Restaurer la preprod depuis l'export anonymisé
        env:
          DATE: ${{ needs.exporter.outputs.date }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "date invalide" >&2; exit 1; }
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "variable DEPLOY_HOST absente ou invalide" >&2; exit 1; }
          ssh -i "$RUNNER_TEMP/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" "deploy@$DEPLOY_HOST" restaurer "restauration/$DATE-prod-anonyme/" < /dev/null
      - name: Nettoyage
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"
