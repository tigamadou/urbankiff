# Valeurs du projet pour le moteur d'environnement d'agent devteam (scripts/devteam/agent-env/agent-env.sh).
# Ce fichier est aussi le document des profils et du budget : les chiffres n'existent qu'ici.
# Coûts mesurés le 2026-11-15 (tâche budget machine, Point 7) : pic observé arrondi à 50 Mo au-dessus ; STACK = régime établi.

DEVTEAM_PROJET=urbankiff
DEVTEAM_PROFILS="api front panel complet"

DEVTEAM_COUT_MO_api=750
DEVTEAM_COUT_MO_front=2050
DEVTEAM_COUT_MO_panel=1100
DEVTEAM_COUT_MO_complet=3050

DEVTEAM_SERVICES_api="agent-api agent-workers agent-migrations"
DEVTEAM_SERVICES_front="agent-nextjs"
DEVTEAM_SERVICES_panel="agent-panel"
DEVTEAM_SERVICES_complet="agent-api agent-workers agent-migrations agent-nextjs agent-panel"

DEVTEAM_STACK_MO=2000
DEVTEAM_MARGE_MO=1500

DEVTEAM_COMPOSE_FICHIERS="compose.agent.yml"
DEVTEAM_PROJET_PRINCIPAL=urbankiff
DEVTEAM_SERVICES_INFRA="postgresDB redis minio mailhog imgproxy caddy"

# Adaptateurs : scripts/devteam-adaptateurs/<type>.sh. redis:1 = un numéro de base par lot (2 à 15, jamais 0 ni 1).
# port : plage 41000-41099, hors de tous les ports publiés par docker-compose.yml.
# fichiers-locaux : .env ignorés par git, copiés du dépôt principal dans le worktree du lot (compose.agent.yml en a besoin).
DEVTEAM_RESSOURCES="fichiers-locaux:.env,apps/api/.env,apps/nextjs/.env postgres:urbankiff_{lot} redis:1 s3:urbankiff-{lot} port:41000-41099"

DEVTEAM_PG_SERVICE=postgresDB            # identifiants Postgres lus à l'exécution dans le conteneur (POSTGRES_USER)
DEVTEAM_REDIS_SERVICE=redis              # service Compose ; conteneur redis_cache
DEVTEAM_RESEAU_INFRA=URBANKIFF
DEVTEAM_S3_ENDPOINT=http://minio:9000    # identifiants lus à l'exécution dans le conteneur minio (MINIO_ROOT_*)

DEVTEAM_LOT_MAX=40
