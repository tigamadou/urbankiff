---
- name: Dossier des manifestes sur le serveur
  ansible.builtin.file:
    path: "{{ plateforme_dossier_manifestes }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Manifestes vendus (cert-manager, CloudNativePG, plugin Barman Cloud)
  ansible.builtin.include_tasks: manifeste.yml
  loop: "{{ plateforme_manifestes }}"
  loop_control:
    label: "{{ item.fichier }}"

- name: Émetteur Let's Encrypt (challenge HTTP via Traefik)
  ansible.builtin.command: k3s kubectl apply -f -
  args:
    stdin: "{{ lookup('ansible.builtin.template', 'clusterissuer.yaml.j2') }}"
  register: plateforme_issuer
  changed_when: plateforme_issuer.stdout_lines | reject('search', 'unchanged') | list | length > 0

- name: Namespaces, quota de preprod et limites par défaut
  ansible.builtin.command: k3s kubectl apply -f -
  args:
    stdin: "{{ lookup('ansible.builtin.template', 'espaces.yaml.j2') }}"
  register: plateforme_espaces
  changed_when: plateforme_espaces.stdout_lines | reject('search', 'unchanged') | list | length > 0
