---
- name: ServiceAccount, Secret de jeton, Role et RoleBinding du namespace
  ansible.builtin.command: k3s kubectl apply -f -
  args:
    stdin: "{{ lookup('ansible.builtin.template', 'rbac.yaml.j2') }}"
  loop: "{{ deploiement_envs | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: deploiement_rbac
  changed_when: deploiement_rbac.stdout_lines | reject('search', 'unchanged') | list | length > 0

- name: Jeton du ServiceAccount émis
  ansible.builtin.command: >-
    k3s kubectl -n {{ item.value.namespace }} wait secret/deploy-token
    --for=jsonpath='{.data.token}' --timeout=60s
  loop: "{{ deploiement_envs | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false
  check_mode: false

- name: Lecture du jeton et de l'autorité de certification
  ansible.builtin.command: >-
    k3s kubectl -n {{ item.value.namespace }} get secret deploy-token -o jsonpath='{.data.token}{"\n"}{.data.ca\.crt}'
  loop: "{{ deploiement_envs | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: deploiement_jetons
  changed_when: false
  # Lecture seule : en --check, une commande sautée renverrait stdout_lines vide et le kubeconfig planterait.
  check_mode: false
  no_log: true

- name: Kubeconfig de chaque environnement (jamais k3s.yaml)
  ansible.builtin.template:
    src: kubeconfig.j2
    dest: "/home/{{ deploiement_utilisateur }}/.kube/{{ item.item.key }}"
    owner: "{{ deploiement_utilisateur }}"
    group: "{{ deploiement_utilisateur }}"
    mode: "0600"
  loop: "{{ deploiement_jetons.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  vars:
    deploiement_env: "{{ item.item.key }}"
    deploiement_namespace: "{{ item.item.value.namespace }}"
    deploiement_jeton: "{{ item.stdout_lines[0] | b64decode }}"
    deploiement_ca: "{{ item.stdout_lines[1] }}"
  no_log: true
