# Un hôte par défaut invalide ; l'hôte `valide` sert de témoin. Connexion locale : seuls les assert sont joués.
all:
  vars:
    ansible_connection: local
    ansible_user: root
  children:
    noeuds:
      vars:
        admin_users:
          - name: admin
            pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKE"
        letsencrypt_email: "test@example.invalid"
        deploy_keys:
          preprod: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFAKEPREPRODFAKEPREPRODFAKEPREPRODFAKEPREPROD"
          prod: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFAKEPRODFAKEPRODFAKEPRODFAKEPRODFAKEPRODFAKEPR"
      children:
        serveur:
          hosts:
            valide: {}
        agents:
          hosts:
            cle_avec_email:
              admin_users:
                - name: admin
                  pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFAKEFAKEFAKEFAKE quelquun@example.invalid"
            admin_vide:
              admin_users: []
            utilisateur_inconnu:
              ansible_user: intrus
            email_absent:
              letsencrypt_email: ""
            cles_identiques:
              deploy_keys:
                preprod: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFAKEMEMECLE"
                prod: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFAKEMEMECLE"
