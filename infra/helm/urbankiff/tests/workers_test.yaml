suite: workers
templates:
  - templates/workers.yaml
values:
  - valeurs-communes.yaml
tests:
  - it: Deployment des workers avec la commande du contrat
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: urbankiff-workers
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/tigamadou/urbankiff-api:1.2.3
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["python", "manage.py", "runworkers"]
  - it: aucune entrée réseau possible, libellés, empreinte
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].ports
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: workers
      - equal:
          path: spec.template.metadata.annotations["urbankiff.com/secrets-checksum"]
          value: test
  - it: même environnement que l'api
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: urbankiff-secrets
            - configMapRef:
                name: urbankiff-config
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_ENDPOINT
            value: redis://:$(REDIS_PASSWORD)@urbankiff-redis:6379/0
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TWILIO_AUTH_TOKEN
            value: desactive
  - it: durcissement, sondes, limites
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 10001
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - exists:
          path: spec.template.spec.containers[0].readinessProbe
      - exists:
          path: spec.template.spec.containers[0].livenessProbe
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 256Mi
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir: {}
  - it: nombre de processus borné (un par CPU par défaut dans multiprocessing, au-delà de la limite mémoire)
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WORKERS_PROCESSES
            value: "1"
  - it: nombre de processus réglable
    set:
      workers.processus: 3
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WORKERS_PROCESSES
            value: "3"
