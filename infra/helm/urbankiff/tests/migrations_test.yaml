suite: migrations
templates:
  - templates/migrations-job.yaml
values:
  - valeurs-communes.yaml
tests:
  - it: Job en crochet avant installation et mise à jour
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: urbankiff-migrations
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded
  - it: commande exacte du contrat
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - sh
            - -c
            - python manage.py migrate && python manage.py loaddata fixtures/admin.json fixtures/mail.json && python manage.py prodseed
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/tigamadou/urbankiff-api:1.2.3
  - it: même environnement que l'api et libellé migrations
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: migrations
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef:
                name: urbankiff-secrets
            - configMapRef:
                name: urbankiff-config
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: urbankiff-pg-app
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TWILIO_ACCOUNT_SID
            value: desactive
  - it: durcissement, limites, borne de durée
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 10001
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 384Mi
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.activeDeadlineSeconds
          value: 1200
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir: {}
