suite: panel
templates:
  - templates/panel.yaml
values:
  - valeurs-communes.yaml
tests:
  - it: Deployment et Service sur 8080, image suffixée par l'environnement
    asserts:
      - equal:
          path: metadata.name
          value: urbankiff-panel
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/tigamadou/urbankiff-panel:1.2.3-preprod
        documentIndex: 0
      - equal:
          path: metadata.name
          value: urbankiff-panel
        documentIndex: 1
      - equal:
          path: spec.ports[0].port
          value: 8080
        documentIndex: 1
  - it: écritures dans /tmp seulement, durcissement, sondes, limites
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 1
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 10001
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - exists:
          path: spec.template.spec.containers[0].readinessProbe
      - exists:
          path: spec.template.spec.containers[0].livenessProbe
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 64Mi
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: panel
