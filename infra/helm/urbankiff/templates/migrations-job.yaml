{{- $env := include "urbankiff.environnement" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: urbankiff-migrations
  labels:
    {{- include "urbankiff.labels" (dict "ctx" . "composant" "migrations") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        {{- include "urbankiff.labels" (dict "ctx" . "composant" "migrations") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- include "urbankiff.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "urbankiff.securityContextPod" . | nindent 8 }}
      containers:
        - name: migrations
          image: {{ include "urbankiff.imageApi" . }}
          command:
            - sh
            - -c
            - python manage.py migrate && python manage.py loaddata fixtures/admin.json fixtures/mail.json && python manage.py prodseed
          envFrom:
            {{- include "urbankiff.envFrom" . | nindent 12 }}
          env:
            {{- include "urbankiff.envApp" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.ressources | nindent 12 }}
          securityContext:
            {{- include "urbankiff.securityContextConteneur" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
