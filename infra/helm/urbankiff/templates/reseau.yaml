{{- $env := include "urbankiff.environnement" . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-entree
  labels:
    app.kubernetes.io/part-of: urbankiff
spec:
  podSelector:
    matchLabels:
      {{- include "urbankiff.selecteur" "api" | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - {{- include "urbankiff.origineTraefik" . | nindent 10 }}
        - podSelector:
            matchLabels:
              {{- include "urbankiff.selecteur" "nextjs" | nindent 14 }}
      ports:
        - port: 8000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextjs-entree
  labels:
    app.kubernetes.io/part-of: urbankiff
spec:
  podSelector:
    matchLabels:
      {{- include "urbankiff.selecteur" "nextjs" | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - {{- include "urbankiff.origineTraefik" . | nindent 10 }}
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: panel-entree
  labels:
    app.kubernetes.io/part-of: urbankiff
spec:
  podSelector:
    matchLabels:
      {{- include "urbankiff.selecteur" "panel" | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - {{- include "urbankiff.origineTraefik" . | nindent 10 }}
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: solveur-http01-entree
  labels:
    app.kubernetes.io/part-of: urbankiff
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - {{- include "urbankiff.origineTraefik" . | nindent 10 }}
      ports:
        - port: 8089
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: applications-sortie
  labels:
    app.kubernetes.io/part-of: urbankiff
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: urbankiff
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [api, workers, migrations]
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: urbankiff-pg
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              {{- include "urbankiff.selecteur" "redis" | nindent 14 }}
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              {{- include "urbankiff.selecteur" "rustfs" | nindent 14 }}
      ports:
        - port: 9000
          protocol: TCP
    - to:
        - {{- include "urbankiff.ipBlockInternet" . | nindent 10 }}
      ports:
        - port: 443
          protocol: TCP
        - port: 465
          protocol: TCP
        - port: 587
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextjs-sortie
  labels:
    app.kubernetes.io/part-of: urbankiff
spec:
  podSelector:
    matchLabels:
      {{- include "urbankiff.selecteur" "nextjs" | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "urbankiff.selecteur" "api" | nindent 14 }}
      ports:
        - port: 8000
          protocol: TCP
