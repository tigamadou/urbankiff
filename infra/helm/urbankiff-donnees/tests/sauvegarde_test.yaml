suite: sauvegarde des fichiers
templates:
  - templates/sauvegarde-fichiers.yaml
values:
  - valeurs-communes.yaml
tests:
  - it: CronJob quotidien sans chevauchement et à historique limité
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: metadata.name
          value: urbankiff-sauvegarde-fichiers
      - equal:
          path: spec.schedule
          value: "30 3 * * *"
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
      - equal:
          path: spec.successfulJobsHistoryLimit
          value: 1
      - equal:
          path: spec.failedJobsHistoryLimit
          value: 3
  - it: copie RustFS vers Wasabi sous fichiers/ sans suppression côté destination
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          value: ["copy", "rustfs:$(BUCKET)", "wasabi:$(WASABI_BUCKET)/fichiers"]
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: WASABI_BUCKET
            value: urbankiff-test
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: RCLONE_CONFIG_WASABI_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: urbankiff-secrets
                key: WASABI_ACCESS_KEY_ID
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: RCLONE_CONFIG_RUSTFS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: urbankiff-secrets
                key: MINIO_ROOT_PASSWORD
  - it: durci, borné, étiqueté
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels["app.kubernetes.io/component"]
          value: sauvegarde-fichiers
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels["app.kubernetes.io/part-of"]
          value: urbankiff
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.runAsUser
          value: 10001
      - equal:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.limits.memory
          value: 128Mi
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: Never
