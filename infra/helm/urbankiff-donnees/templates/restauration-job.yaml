{{- if .Values.restauration.prefixe -}}
{{- $env := include "urbankiff.environnement" . -}}
{{- if not (regexMatch "^restauration/[0-9]{4}-[0-9]{2}-[0-9]{2}(-prod-anonyme)?/?$" .Values.restauration.prefixe) -}}
{{- fail "restauration.prefixe doit valoir restauration/AAAA-MM-JJ/ ou restauration/AAAA-MM-JJ-prod-anonyme/" -}}
{{- end -}}
{{- if lt (int .Values.postgres.versionClientRestauration) (int .Values.postgres.version) -}}
{{- fail "postgres.versionClientRestauration doit être supérieure ou égale à postgres.version" -}}
{{- end -}}
{{- $prefixe := trimSuffix "/" .Values.restauration.prefixe -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: urbankiff-restauration
  labels:
    {{- include "urbankiff.labels" (dict "ctx" . "composant" "restauration") | nindent 4 }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        {{- include "urbankiff.labels" (dict "ctx" . "composant" "restauration") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- include "urbankiff.securityContextPod" . | nindent 8 }}
      initContainers:
        - name: recuperer
          image: {{ .Values.image.rclone }}
          args: ["copy", "wasabi:$(WASABI_BUCKET)/{{ $prefixe }}", "/restauration"]
          env:
            - name: HOME
              value: /tmp
            - name: WASABI_BUCKET
              value: {{ include "urbankiff.wasabiBucket" . }}
            {{- include "urbankiff.rcloneWasabiEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.outils.ressources | nindent 12 }}
          securityContext:
            {{- include "urbankiff.securityContextConteneur" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: restauration
              mountPath: /restauration
        - name: remise-a-zero
          image: {{ printf "%s:%d" .Values.image.postgres (int .Values.postgres.version) }}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              psql -v ON_ERROR_STOP=1 <<'SQL'
              DO $verif$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_namespace WHERE nspname = 'public' AND pg_has_role(current_user, nspowner, 'USAGE')) THEN
                  RAISE EXCEPTION 'le schéma public n''appartient pas à l''utilisateur applicatif : remise à zéro impossible';
                END IF;
              END
              $verif$;
              DROP SCHEMA public CASCADE;
              CREATE SCHEMA public;
              SQL
          env:
            - name: HOME
              value: /tmp
            - name: PGHOST
              value: urbankiff-pg-rw
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: urbankiff-pg-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbankiff-pg-app
                  key: password
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: urbankiff-pg-app
                  key: dbname
          resources:
            {{- toYaml .Values.outils.ressources | nindent 12 }}
          securityContext:
            {{- include "urbankiff.securityContextConteneur" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        - name: pg-restore
          image: {{ printf "%s:%d" .Values.image.postgres (int .Values.postgres.versionClientRestauration) }}
          # pg_restore du client (archive lue jusqu'à sa version) produit le SQL ; « SET transaction_timeout » (inconnu
          # avant PostgreSQL 17) est retiré ; psql s'arrête à la première erreur.
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              pg_restore --no-owner --no-privileges --schema=public -f - /restauration/{{ .Values.restauration.fichierDump }} \
                | sed '/^SET transaction_timeout = /d' \
                | psql -X -q -v ON_ERROR_STOP=1
          env:
            - name: HOME
              value: /tmp
            - name: PGHOST
              value: urbankiff-pg-rw
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: urbankiff-pg-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: urbankiff-pg-app
                  key: password
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: urbankiff-pg-app
                  key: dbname
          resources:
            {{- toYaml .Values.outils.ressources | nindent 12 }}
          securityContext:
            {{- include "urbankiff.securityContextConteneur" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: restauration
              mountPath: /restauration
      containers:
        - name: fichiers
          image: {{ .Values.image.rclone }}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              if [ -d /restauration/fichiers ]; then
                rclone copy /restauration/fichiers "rustfs:$BUCKET"
              else
                echo "sauvegarde sans fichiers : rien à copier"
              fi
              echo restauration terminée
          env:
            - name: HOME
              value: /tmp
            - name: BUCKET
              valueFrom:
                configMapKeyRef:
                  name: urbankiff-config
                  key: MINIO_DEFAULT_BUCKETS
            {{- include "urbankiff.rcloneRustfsEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.outils.ressources | nindent 12 }}
          securityContext:
            {{- include "urbankiff.securityContextConteneur" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: restauration
              mountPath: /restauration
      volumes:
        - name: tmp
          emptyDir: {}
        - name: restauration
          emptyDir: {}
{{- end }}
